<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Leonardo Vinicius - Desenvolvedor e Marketing Digital">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14100b"/>
      <stop offset="1" stop-color="#0b0906"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#17191d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .trace { fill: none; stroke: #c9893a; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .trace2 { fill: none; stroke: #8a5a20; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
      .pad { fill: #0b0906; stroke: #e0a24a; stroke-width: 2.4; }
      .mono { font-family: 'Courier New', ui-monospace, monospace; }
      .pulse { stroke-dasharray: 14 120; animation: run 3.2s linear infinite; }
      .pulse.b { animation-duration: 4.4s; animation-delay: -1.2s; }
      @keyframes run { from { stroke-dashoffset: 134; } to { stroke-dashoffset: 0; } }
      .led { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    </style>
  </defs>

  <rect width="900" height="260" rx="10" fill="url(#bg)" stroke="#3a2c18" stroke-width="2"/>

  <!-- Trilhas esquerda -->
  <g>
    <path class="trace" d="M40 60 H150 L190 100 H300"/>
    <path class="trace" d="M40 100 H110 L140 130 H300"/>
    <path class="trace" d="M40 130 H80 L110 160 H300"/>
    <path class="trace" d="M40 200 H150 L190 160 H260 L280 145 H300"/>
    <path class="trace2" d="M40 80 H120 L160 115 H300"/>
    <path class="trace2" d="M40 180 H100 L130 150 H300"/>
    <!-- trilhas direita -->
    <path class="trace" d="M860 60 H750 L710 100 H600"/>
    <path class="trace" d="M860 100 H790 L760 130 H600"/>
    <path class="trace" d="M860 130 H820 L790 160 H600"/>
    <path class="trace" d="M860 200 H750 L710 160 H640 L620 145 H600"/>
    <path class="trace2" d="M860 80 H780 L740 115 H600"/>
    <path class="trace2" d="M860 180 H800 L770 150 H600"/>
  </g>

  <!-- Pulsos de energia nas trilhas -->
  <g filter="url(#glow)">
    <path class="trace pulse" stroke="#ffd27a" d="M40 60 H150 L190 100 H300"/>
    <path class="trace pulse b" stroke="#ffd27a" d="M40 200 H150 L190 160 H260 L280 145 H300"/>
    <path class="trace pulse" stroke="#ffd27a" d="M860 60 H750 L710 100 H600"/>
    <path class="trace pulse b" stroke="#ffd27a" d="M860 130 H820 L790 160 H600"/>
  </g>

  <!-- Pads -->
  <circle class="pad" cx="40" cy="60" r="7"/><circle class="pad" cx="40" cy="100" r="7"/>
  <circle class="pad" cx="40" cy="130" r="7"/><circle class="pad" cx="40" cy="200" r="7"/>
  <circle class="pad" cx="860" cy="60" r="7"/><circle class="pad" cx="860" cy="100" r="7"/>
  <circle class="pad" cx="860" cy="130" r="7"/><circle class="pad" cx="860" cy="200" r="7"/>

  <!-- Parafusos nos cantos -->
  <circle class="pad" cx="26" cy="26" r="8"/><circle class="pad" cx="874" cy="26" r="8"/>
  <circle class="pad" cx="26" cy="234" r="8"/><circle class="pad" cx="874" cy="234" r="8"/>

  <!-- Rótulos laterais -->
  <text class="mono" x="40" y="42" fill="#a8742c" font-size="11" letter-spacing="2">IN · IDEIAS</text>
  <text class="mono" x="860" y="42" fill="#a8742c" font-size="11" letter-spacing="2" text-anchor="end">OUT · RESULTADOS</text>
  <text class="mono" x="40" y="232" fill="#6e4d1f" font-size="11" letter-spacing="2">01001100 01010110</text>

  <!-- Chip central -->
  <g>
    <!-- pinos -->
    <g fill="#c9c9c9">
      <rect x="318" y="76" width="10" height="14"/><rect x="342" y="76" width="10" height="14"/>
      <rect x="366" y="76" width="10" height="14"/><rect x="390" y="76" width="10" height="14"/>
      <rect x="414" y="76" width="10" height="14"/><rect x="438" y="76" width="10" height="14"/>
      <rect x="462" y="76" width="10" height="14"/><rect x="486" y="76" width="10" height="14"/>
      <rect x="510" y="76" width="10" height="14"/><rect x="534" y="76" width="10" height="14"/>
      <rect x="558" y="76" width="10" height="14"/>
      <rect x="318" y="170" width="10" height="14"/><rect x="342" y="170" width="10" height="14"/>
      <rect x="366" y="170" width="10" height="14"/><rect x="390" y="170" width="10" height="14"/>
      <rect x="414" y="170" width="10" height="14"/><rect x="438" y="170" width="10" height="14"/>
      <rect x="462" y="170" width="10" height="14"/><rect x="486" y="170" width="10" height="14"/>
      <rect x="510" y="170" width="10" height="14"/><rect x="534" y="170" width="10" height="14"/>
      <rect x="558" y="170" width="10" height="14"/>
    </g>
    <rect x="300" y="88" width="300" height="84" rx="6" fill="url(#chip)" stroke="#4a4e57" stroke-width="2"/>
    <circle cx="316" cy="104" r="4" fill="#0b0906" stroke="#5a5f69"/>
    <text class="mono" x="450" y="130" fill="#fff4de" font-size="25" font-weight="700" text-anchor="middle" letter-spacing="1" filter="url(#glow)">LEONARDO VINICIUS</text>
    <text class="mono" x="450" y="154" fill="#e0a24a" font-size="12" text-anchor="middle" letter-spacing="4">DEV · MARKETING DIGITAL</text>
  </g>

  <!-- LED de status -->
  <circle class="led" cx="580" cy="104" r="4" fill="#4ade80" filter="url(#glow)"/>
  <text class="mono" x="450" y="236" fill="#6e4d1f" font-size="11" text-anchor="middle" letter-spacing="3">GUARULHOS · SÃO PAULO · BR</text>
</svg>
